<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuricataMonitor · Suricata IDS Management</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <!-- Theme zuerst inline setzen, damit kein "Flash of unstyled" passiert -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("surimon.theme");
                var theme = stored ||
                    (window.matchMedia &&
                     window.matchMedia("(prefers-color-scheme: dark)").matches
                     ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {}
        }());
    </script>
</head>
<body>

<div class="app-shell" id="app-shell" data-sidebar-collapsed="false">

    <!-- ============================== Sidebar ============================== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg" stroke-width="2"
                 stroke="#60a5fa" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 L4 6 v6 c0 5 3.5 9 8 10 4.5-1 8-5 8-10 V6 z"/>
                <path d="M9 12 l2 2 4-4"/>
            </svg>
            <div class="sidebar-brand-text">
                <div class="title">SuricataMonitor</div>
                <div class="subtitle">Suricata IDS Management</div>
            </div>
        </div>

        <button class="sidebar-toggle" id="btn-sidebar-toggle"
                title="Sidebar ein-/ausklappen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <nav class="sidebar-nav">
            <a class="nav-item" data-route="dashboard">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9"/>
                        <rect x="14" y="3" width="7" height="5"/>
                        <rect x="14" y="12" width="7" height="9"/>
                        <rect x="3" y="16" width="7" height="5"/>
                    </svg>
                </span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a class="nav-item" data-route="events">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </span>
                <span class="nav-label">Event-Log</span>
            </a>
            <a class="nav-item" data-route="rulesets">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </span>
                <span class="nav-label">Rulesets</span>
            </a>
            <a class="nav-item" data-route="settings">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="nav-label">v1.0.0-ng</span>
        </div>
    </aside>

    <!-- ============================== Header =============================== -->
    <header class="app-header">
        <div class="header-search">
            <!-- Global search Platzhalter - kann spaeter befuellt werden -->
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="btn-theme-toggle"
                    title="Hell/Dunkel umschalten">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <span id="theme-label">Hell</span>
            </button>

            <button class="user-menu-trigger" id="btn-user-menu" title="User-Menue">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="username" id="user-username">-</span>
                <span class="role-badge" id="user-role">-</span>
            </button>

            <button class="btn btn-sm" id="btn-logout" title="Abmelden">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ============================== Content ============================== -->
    <main class="app-content" id="app-content">
        <div class="loading-block">
            <div class="spinner"></div>
            <div class="mt-12">Lade…</div>
        </div>
    </main>

</div>

<!-- Libs -->
<script src="/js/lib/utils.js"></script>
<script src="/js/lib/api.js"></script>
<script src="/js/lib/router.js"></script>
<script src="/js/lib/theme.js"></script>
<script src="/js/lib/components.js"></script>

<!-- Pages -->
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/events.js"></script>
<script src="/js/pages/rulesets.js"></script>
<script src="/js/pages/settings.js"></script>

<!-- App-Bootstrap -->
<script src="/js/app.js"></script>

</body>
</html>
