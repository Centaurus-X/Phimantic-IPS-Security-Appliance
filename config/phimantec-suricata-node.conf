# Φmantec Suricata-host side configuration
# Bind both lane sink and inspectord on the Suricata node.

[lane]
enabled = true
addr = "0.0.0.0:18080"
log_path = "/tmp/phimantec-lane.jsonl"

[flowbus]
enabled = true
addr = "0.0.0.0:18090"
pool_size = 16
token = "change-me-in-production"
timeout_ms = 3000
connect_timeout_ms = 500
read_timeout_ms = 3000
keepalive = false

[verdict]
fail_policy = "closed"
timeout_ms = 900
no_alert_grace_ms = 100

[suricata]
eve_path = "/var/log/suricata/eve.json"
