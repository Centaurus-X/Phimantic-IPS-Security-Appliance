# PHIMANTEC Docker Suricata-node profile.
# Suricata, lane-sink, inspectord and SuricataMonitor run in the same node
# container for a compact lab/runtime image.

[lane]
enabled = true
addr = "127.0.0.1:18080"
log_path = "/var/log/phimantec/lane.jsonl"

[flowbus]
enabled = true
addr = "127.0.0.1:18090"
pool_size = 16
token = "phimantec-docker-token-change-me"
timeout_ms = 3000
connect_timeout_ms = 500
read_timeout_ms = 3000
keepalive = false

[verdict]
fail_policy = "closed"
timeout_ms = 900
no_alert_grace_ms = 100

[suricata]
eve_path = "/var/log/suricata/eve.json"
