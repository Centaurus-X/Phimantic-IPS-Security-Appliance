name: Bug Report
description: Report a defect in the Phimantic IPS Security Appliance
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.

        **Security vulnerabilities must NOT be reported here.**
        Please follow the process described in [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the defect and what you expected instead.
      placeholder: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag (e.g. v0.4.0), product state (e.g. 0.3.18-monitor-offline-vendor), or commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, deployment mode (compose/host), relevant hardware.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant logs. Remove secrets, certificates, keys, and internal hostnames/IPs before posting.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This report contains no security-sensitive vulnerability details (those belong in the SECURITY.md process).
          required: true
        - label: I removed secrets, private keys, and internal identifiers from all attached material.
          required: true
