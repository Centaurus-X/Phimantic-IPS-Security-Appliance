<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="620" viewBox="0 0 1460 620" role="img" aria-labelledby="title desc">
  <title id="title">Ruleset Reload Workflow</title>
  <desc id="desc">Web management saves rules, validates with suricata -T, reloads the running Suricata engine and updates runtime state.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 800; fill: #111827; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 16; }
      .ok { fill: #dcfce7; stroke: #16a34a; }
      .warn { fill: #fef3c7; stroke: #d97706; }
      .fail { fill: #fee2e2; stroke: #dc2626; }
      .node { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; fill: #334155; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/></marker>
  </defs>
  <rect class="bg" width="1460" height="620"/>
  <text x="48" y="60" class="title">Runtime-safe ruleset management</text>
  <text x="48" y="94" class="sub">The UI may edit rule files, but the running engine is changed only after validation and a successful reload.</text>

  <rect x="60" y="155" width="215" height="120" rx="16" class="box"/>
  <text x="90" y="204" class="node">Rule edit</text>
  <text x="90" y="236" class="small">UI writes local, ET/Open</text>
  <text x="90" y="259" class="small">or external rules file</text>

  <rect x="345" y="155" width="215" height="120" rx="16" class="warn"/>
  <text x="375" y="204" class="node">Reload required</text>
  <text x="375" y="236" class="small">File state changed;</text>
  <text x="375" y="259" class="small">runtime not yet updated</text>

  <rect x="630" y="155" width="215" height="120" rx="16" class="box"/>
  <text x="660" y="204" class="node">Backup</text>
  <text x="660" y="236" class="small">Keep previous YAML</text>
  <text x="660" y="259" class="small">and rule files</text>

  <rect x="915" y="155" width="215" height="120" rx="16" class="box"/>
  <text x="945" y="204" class="node">suricata -T</text>
  <text x="945" y="236" class="small">Validate syntax, config</text>
  <text x="945" y="259" class="small">and merged rule-files</text>

  <rect x="1200" y="155" width="215" height="120" rx="16" class="ok"/>
  <text x="1230" y="204" class="node">Live reload</text>
  <text x="1230" y="236" class="small">ruleset-reload-rules</text>
  <text x="1230" y="259" class="small">then runtime loaded</text>

  <rect x="915" y="375" width="215" height="120" rx="16" class="fail"/>
  <text x="945" y="424" class="node">Validation failed</text>
  <text x="945" y="456" class="small">No reload is triggered;</text>
  <text x="945" y="479" class="small">old engine remains active</text>

  <rect x="1200" y="375" width="215" height="120" rx="16" class="fail"/>
  <text x="1230" y="424" class="node">Reload failed</text>
  <text x="1230" y="456" class="small">UI shows stage + detail;</text>
  <text x="1230" y="479" class="small">fail-closed chain remains</text>

  <path d="M275 215 H345" class="arrow"/>
  <path d="M560 215 H630" class="arrow"/>
  <path d="M845 215 H915" class="arrow"/>
  <path d="M1130 215 H1200" class="arrow"/>
  <path d="M1022 275 V375" class="red"/>
  <path d="M1308 275 V375" class="red"/>

  <text x="60" y="560" class="sub">Security invariant: invalid or failed rule updates do not weaken enforcement; Suricata remains the only inspection decision source.</text>
</svg>
